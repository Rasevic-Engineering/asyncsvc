name: asyncsvc
runtime: go
description: GCP infrastructure for the async Go REST service (Cloud Run or GKE Autopilot, Cloud SQL, Pub/Sub, BigQuery, GCS, Firebase Auth)
config:
  asyncsvc:platform:
    type: string
    default: cloudrun   # or: gke
  asyncsvc:workerReplicas:
    type: integer
    default: 2          # gke only
  asyncsvc:dbTier:
    type: string
    default: db-f1-micro
  asyncsvc:bigqueryLocation:
    type: string
    default: US
  asyncsvc:mailFrom:
    type: string
    default: reports@example.com
  asyncsvc:publicApi:
    type: boolean
    default: true       # the API enforces Firebase auth itself
  asyncsvc:adminEmails:
    type: string
    default: ""         # comma-separated; verified emails that get the admin role
  asyncsvc:ingesterEnabled:
    type: boolean
    default: true       # live sports ingester (NHL + soccer replays): 1 always-on instance, ~$25–50/month
  asyncsvc:ingesterLeagues:
    type: string
    default: nhl,mlb,nba,nfl,soccer   # live leagues to poll; "none" keeps the ingester for soccer replays only
  asyncsvc:customDomain:
    type: string
    default: ""         # e.g. asyncsvc.example.com (Cloud Run domain mapping; verify the domain first)
  asyncsvc:githubRepository:
    type: string
    default: ""         # owner/name; creates keyless GitHub Actions deploy access
  asyncsvc:githubEnvironment:
    type: string
    default: ""         # GitHub environment allowed to deploy (defaults to the stack name)
  asyncsvc:githubBranch:
    type: string
    default: main
  asyncsvc:googleOAuthClientId:
    type: string
    default: ""         # optional; enables Google sign-in (also set googleOAuthClientSecret as a secret)
  asyncsvc:deletionProtection:
    type: boolean
    default: true
